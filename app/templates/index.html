<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vanna NL2SQL</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>Vanna NL2SQL</h1>
      <p>Ask a question about your database. Optionally execute the generated SQL.</p>

      <form id="ask-form">
        <label for="question">Question</label>
        <textarea id="question" name="question" rows="3" placeholder="e.g., What are the top 10 customers by revenue in 2024?"></textarea>

        <div class="row">
          <label><input type="checkbox" id="execute" /> Execute SQL</label>
          <label>Limit <input type="number" id="limit" min="1" max="1000" value="50" /></label>
          <button type="submit">Ask</button>
        </div>
      </form>

      <section>
        <h2>Generated SQL</h2>
        <pre id="sql"></pre>
      </section>

      <section>
        <h2>Results</h2>
        <div id="results"></div>
      </section>

      <footer>
        <small>
          Backend: REST at <code>/api</code>. Health: <a href="/api/health" target="_blank">/api/health</a>.
        </small>
      </footer>
    </div>

    <script src="/static/main.js"></script>
  </body>
</html>
